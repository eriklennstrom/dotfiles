# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds

# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above

# Clamped workspace navigation (limits to groups of 7)
bind = Ctrl+Super, Right, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace r+1 # [hidden]
bind = Ctrl+Super, Left, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace r-1 # [hidden]
bind = Super, Page_Down, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace +1 # [hidden]
bind = Super, Page_Up, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace -1 # [hidden]
bind = Ctrl+Super, Page_Down, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace r+1 # [hidden]
bind = Ctrl+Super, Page_Up, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace r-1 # [hidden]
bind = Super, mouse_up, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace +1 # [hidden]
bind = Super, mouse_down, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace -1 # [hidden]
bind = Ctrl+Super, mouse_up, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace r+1 # [hidden]
bind = Ctrl+Super, mouse_down, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace r-1 # [hidden]
bind = Ctrl+Super, BracketLeft, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace -1 # [hidden]
bind = Ctrl+Super, BracketRight, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace +1 # [hidden]
bind = Ctrl+Super, Up, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace r-5 # [hidden]
bind = Ctrl+Super, Down, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh workspace r+5 # [hidden]

# Clamped move-to-workspace
bind = Super+Shift, mouse_down, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh movetoworkspace r-1 # [hidden]
bind = Super+Shift, mouse_up, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh movetoworkspace r+1 # [hidden]
bind = Super+Alt, mouse_down, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh movetoworkspace -1 # [hidden]
bind = Super+Alt, mouse_up, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh movetoworkspace +1 # [hidden]
bind = Super+Alt, Page_Down, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh movetoworkspace +1 # [hidden]
bind = Super+Alt, Page_Up, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh movetoworkspace -1 # [hidden]
bind = Super+Shift, Page_Down, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh movetoworkspace r+1 # [hidden]
bind = Super+Shift, Page_Up, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh movetoworkspace r-1 # [hidden]
bind = Ctrl+Super+Shift, Right, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh movetoworkspace r+1 # [hidden]
bind = Ctrl+Super+Shift, Left, exec, ~/.config/hypr/hyprland/scripts/workspace_clamped.sh movetoworkspace r-1 # [hidden]

