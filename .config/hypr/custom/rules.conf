# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# Re-enable blur for windows (upstream disables it globally)
windowrule = match:class .*, no_blur off

# Kitty terminal opacity
windowrule = match:class ^(kitty)$, opacity 0.85 override

# Bar and vertical bar: disable xray so blurred background shows content behind
layerrule = match:namespace quickshell:bar, xray off
layerrule = match:namespace quickshell:bar, ignore_alpha 0.5
layerrule = match:namespace quickshell:verticalBar, xray off
layerrule = match:namespace quickshell:verticalBar, ignore_alpha 0.5
